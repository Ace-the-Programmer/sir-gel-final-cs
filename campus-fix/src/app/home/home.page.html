<ion-content [fullscreen]="true" class="splash-content" (click)="goToNext()">
  <ion-grid class="splash-grid">
    <ion-row class="splash-row ion-justify-content-center ion-align-items-center">
      <ion-col size="12" size-sm="10" size-md="8" size-lg="6" size-xl="4" class="ion-text-center">
        <ion-img
          src="assets/icon/locarate-logo.svg"
          alt="LocaRate Logo"
          class="splash-logo"
        ></ion-img>

        <ion-text class="brand-title">
          <ion-text class="brand-loca">Loca</ion-text>
          <ion-text class="brand-rate">Rate</ion-text>
        </ion-text>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
