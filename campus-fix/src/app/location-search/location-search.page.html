<ion-content [fullscreen]="true" class="location-search-content">
  <ion-grid class="search-page-grid">

    <!-- Top Route Input Section -->
    <ion-row class="route-input-row ion-align-items-center">
      <!-- Left Track: Origin Dot, Dashed Line, Destination Pin -->
      <ion-col size="auto" class="route-track-col">
        <div class="origin-dot">
          <div class="dot-inner"></div>
        </div>
        <div class="track-dashed-line"></div>
        <div class="dest-pin">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#1b3964">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5" fill="#ffffff"/>
          </svg>
        </div>
      </ion-col>

      <!-- Right Inputs: Start Location & Destination Pills -->
      <ion-col class="route-inputs-col">
        <ion-item lines="none" class="input-pill-item">
          <ion-input
            type="text"
            placeholder="Choose Start Location"
            [(ngModel)]="startLocation"
            class="pill-ionic-input"
          ></ion-input>
          <ion-button fill="clear" slot="end" class="btn-input-icon" (click)="useCurrentLocation()" aria-label="Use current location">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#254d7d" stroke-width="2">
              <circle cx="12" cy="12" r="6" />
              <line x1="12" y1="2" x2="12" y2="5" stroke-linecap="round"/>
              <line x1="12" y1="19" x2="12" y2="22" stroke-linecap="round"/>
              <line x1="2" y1="12" x2="5" y2="12" stroke-linecap="round"/>
              <line x1="19" y1="12" x2="22" y2="12" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="2" fill="#254d7d" />
            </svg>
          </ion-button>
        </ion-item>

        <ion-item lines="none" class="input-pill-item">
          <ion-input
            type="text"
            placeholder="Choose Destination"
            [(ngModel)]="destination"
            class="pill-ionic-input"
          ></ion-input>
          <ion-button fill="clear" slot="end" class="btn-input-icon" aria-label="Destination location">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#254d7d">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
              <circle cx="12" cy="9" r="2.5" fill="#bcd7f5"/>
            </svg>
          </ion-button>
        </ion-item>
      </ion-col>
    </ion-row>

    <!-- Mode Selector Row -->
    <ion-row class="transport-modes-row ion-justify-content-around ion-align-items-center">
      <ion-col
        size="3"
        class="mode-item ion-text-center"
        [class.selected-mode]="selectedMode === 'car'"
        (click)="selectMode('car')"
      >
        <ion-img src="assets/icon/mode-car.png" alt="Car" class="mode-icon-img"></ion-img>
        <ion-text class="mode-label">Car</ion-text>
      </ion-col>

      <ion-col
        size="3"
        class="mode-item ion-text-center"
        [class.selected-mode]="selectedMode === 'tricycle'"
        (click)="selectMode('tricycle')"
      >
        <ion-img src="assets/icon/mode-tricycle.png" alt="Tricycle" class="mode-icon-img"></ion-img>
        <ion-text class="mode-label">Tricycle</ion-text>
      </ion-col>

      <ion-col
        size="3"
        class="mode-item ion-text-center"
        [class.selected-mode]="selectedMode === 'bicycle'"
        (click)="selectMode('bicycle')"
      >
        <ion-img src="assets/icon/mode-bicycle.png" alt="Bicycle" class="mode-icon-img"></ion-img>
        <ion-text class="mode-label">Bicycle</ion-text>
      </ion-col>

      <ion-col
        size="3"
        class="mode-item ion-text-center"
        [class.selected-mode]="selectedMode === 'walk'"
        (click)="selectMode('walk')"
      >
        <ion-img src="assets/icon/mode-walk.png" alt="Walk" class="mode-icon-img"></ion-img>
        <ion-text class="mode-label">Walk</ion-text>
      </ion-col>
    </ion-row>

    <!-- Center Space -->
    <ion-row class="center-content-space" (click)="onEstimate()"></ion-row>

    <!-- Floating Estimate Button on Lower Right -->
    <ion-row class="estimate-btn-row ion-justify-content-end">
      <ion-col size="auto">
        <ion-button shape="round" class="btn-estimate" (click)="onEstimate()">
          <ion-text>Estimate</ion-text>
        </ion-button>
      </ion-col>
    </ion-row>

    <!-- Bottom Navigation Bar (Route tab active with elevated badge!) -->
    <ion-row class="bottom-nav-bar ion-align-items-center ion-justify-content-around">
      <!-- Tab 1: Home -->
      <ion-col class="nav-tab ion-text-center">
        <ion-button fill="clear" class="btn-nav-tab" (click)="goToHome()" aria-label="Home">
          <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.2">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1v-9.5z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </ion-button>
      </ion-col>

      <!-- Tab 2: Location Pin -->
      <ion-col class="nav-tab ion-text-center">
        <ion-button fill="clear" class="btn-nav-tab" (click)="goToMap()" aria-label="Location Map">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="9" r="2.5" fill="#ffffff" />
          </svg>
        </ion-button>
      </ion-col>

      <!-- Tab 3: Route (Elevated with circular badge in notch!) -->
      <ion-col class="nav-tab active-tab ion-text-center">
        <ion-button fill="clear" class="btn-elevated-route" aria-label="Route Estimation">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2">
            <circle cx="6" cy="18" r="2.5" fill="#ffffff" />
            <circle cx="18" cy="6" r="2.5" fill="#ffffff" />
            <path d="M6 15.5 C 6 11, 18 13, 18 8.5" stroke-linecap="round" stroke-dasharray="2 3" />
          </svg>
        </ion-button>
      </ion-col>

      <!-- Tab 4: Profile -->
      <ion-col class="nav-tab ion-text-center">
        <ion-button fill="clear" class="btn-nav-tab" (click)="onProfileClick()" aria-label="User Profile">
          <svg class="nav-icon" viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#ffffff" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="10" r="3" />
            <path d="M6.168 18.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.832 2.849" />
          </svg>
        </ion-button>
      </ion-col>
    </ion-row>

  </ion-grid>
</ion-content>
