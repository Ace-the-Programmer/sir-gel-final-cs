<ion-content [fullscreen]="true" class="login-content">
  <ion-grid class="login-grid">
    <!-- Top Bar with Back Button -->
    <ion-row class="top-nav-row ion-align-items-center">
      <ion-col size="12">
        <ion-button fill="clear" size="small" class="btn-back" (click)="onBack()" aria-label="Go back">
          <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>

    <!-- Center Content: Logo, Heading, Form, Social Logins -->
    <ion-row class="ion-justify-content-center ion-align-items-center login-body-row">
      <ion-col size="12" class="login-form-col ion-text-center">

        <!-- LocaRate Logo -->
        <div class="logo-wrapper">
          <ion-img
            src="assets/icon/locarate-logo-dark.svg"
            alt="LocaRate"
            class="login-logo-img"
          ></ion-img>
        </div>

        <!-- Welcome Heading -->
        <ion-text class="welcome-heading">Welcome back, Loca!</ion-text>

        <!-- Input Fields -->
        <form class="login-form" (ngSubmit)="onLogin()">
          <ion-item lines="none" class="custom-input-item">
            <ion-input
              type="text"
              placeholder="Username"
              [(ngModel)]="username"
              name="username"
              class="custom-ionic-input"
              required
            ></ion-input>
          </ion-item>

          <ion-item lines="none" class="custom-input-item">
            <ion-input
              type="password"
              placeholder="Password"
              [(ngModel)]="password"
              name="password"
              class="custom-ionic-input"
              required
            ></ion-input>
          </ion-item>

          <!-- Login Button -->
          <ion-button expand="block" shape="round" class="btn-login-pill" (click)="onLogin()">
            <ion-text>Login</ion-text>
          </ion-button>
        </form>

        <!-- OR Divider -->
        <div class="divider-wrapper">
          <div class="divider-line"></div>
          <ion-text class="divider-text">OR</ion-text>
          <div class="divider-line"></div>
        </div>

        <!-- Social Login Buttons -->
        <div class="social-login-group">
          <!-- Sign in with Google -->
          <ion-button expand="block" shape="round" class="btn-social-pill" (click)="goToGoogleAuth()">
            <svg slot="start" class="social-svg-icon" viewBox="0 0 24 24" width="22" height="22">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <ion-text class="social-text">Sign in with Google</ion-text>
          </ion-button>

          <!-- Log in with Facebook -->
          <ion-button expand="block" shape="round" class="btn-social-pill" (click)="goToFacebookAuth()">
            <svg slot="start" class="social-svg-icon" viewBox="0 0 24 24" width="22" height="22" fill="#ffffff">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <ion-text class="social-text">Log in with Facebook</ion-text>
          </ion-button>
        </div>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
