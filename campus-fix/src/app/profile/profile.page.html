<ion-content [fullscreen]="true" class="profile-content">
  <ion-grid class="profile-main-grid ion-no-padding">

    <!-- Top User Header Banner -->
    <ion-row class="profile-header-banner ion-align-items-center">
      <ion-col size="auto" class="avatar-col">
        <div class="avatar-badge-wrapper">
          <ion-avatar class="user-avatar">
            <ion-img
              src="assets/icon/quenie-avatar.png"
              alt="Queenie Dapooh"
              class="user-avatar-img"
            ></ion-img>
          </ion-avatar>
          <ion-button fill="clear" class="edit-badge-btn" aria-label="Edit Profile">
            <ion-icon name="pencil" class="pencil-icon"></ion-icon>
          </ion-button>
        </div>
      </ion-col>

      <ion-col class="user-meta-col">
        <ion-text class="user-display-name">Queenie Dapooh</ion-text>
        <ion-text class="user-handle-name">@queeniedapooh</ion-text>
      </ion-col>

      <ion-col size="auto" class="logout-header-col">
        <ion-button fill="clear" class="btn-logout-header" (click)="onLogout()" aria-label="Log Out" title="Log Out">
          <ion-icon name="log-out-outline" class="logout-header-icon"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>

    <!-- Main Content Area -->
    <ion-row class="profile-body-row">
      <ion-col size="12">
        <!-- Section Title -->
        <ion-text class="section-heading">Search History</ion-text>

        <!-- History Cards List -->
        <ion-list lines="none" class="history-cards-list">

          <!-- Card 1: Car -->
          <ion-card class="history-card" (click)="selectHistory(0)">
            <ion-card-content class="history-card-inner">
              <ion-avatar class="card-icon-circle">
                <ion-img src="assets/icon/mode-car.png" alt="Car" class="history-mode-icon"></ion-img>
              </ion-avatar>

              <div class="card-info-col">
                <ion-text class="mode-title">Car</ion-text>
                <ion-text class="route-subtitle">Sumacab - SM Mega Center</ion-text>
                <ion-text class="distance-text">6.1 km</ion-text>
              </div>

              <div class="card-fare-col">
                <ion-text class="fare-amount">₱ 130.00</ion-text>
                <div class="radio-select-circle" [class.checked]="selectedCard === 0"></div>
              </div>
            </ion-card-content>
          </ion-card>

          <!-- Card 2: Tricycle -->
          <ion-card class="history-card" (click)="selectHistory(1)">
            <ion-card-content class="history-card-inner">
              <ion-avatar class="card-icon-circle">
                <ion-img src="assets/icon/mode-tricycle.png" alt="Tricycle" class="history-mode-icon"></ion-img>
              </ion-avatar>

              <div class="card-info-col">
                <ion-text class="mode-title">Tricycle</ion-text>
                <ion-text class="route-subtitle">Sumacab - Santa Rosa</ion-text>
                <ion-text class="distance-text">3.4 km</ion-text>
              </div>

              <div class="card-fare-col">
                <ion-text class="fare-amount">₱ 80.00</ion-text>
                <div class="radio-select-circle" [class.checked]="selectedCard === 1"></div>
              </div>
            </ion-card-content>
          </ion-card>

          <!-- Card 3: Bicycle -->
          <ion-card class="history-card" (click)="selectHistory(2)">
            <ion-card-content class="history-card-inner">
              <ion-avatar class="card-icon-circle">
                <ion-img src="assets/icon/mode-bicycle.png" alt="Bicycle" class="history-mode-icon"></ion-img>
              </ion-avatar>

              <div class="card-info-col">
                <ion-text class="mode-title">Bicycle</ion-text>
                <ion-text class="route-subtitle">Sumacab - Pacific NE</ion-text>
                <ion-text class="distance-text">2.3 km</ion-text>
              </div>

              <div class="card-fare-col">
                <ion-text class="fare-amount">₱ 80.00</ion-text>
                <div class="radio-select-circle" [class.checked]="selectedCard === 2"></div>
              </div>
            </ion-card-content>
          </ion-card>

        </ion-list>

        <!-- Log Out Button -->
        <ion-row class="logout-btn-row ion-justify-content-center">
          <ion-col size="10" size-sm="8" size-md="6">
            <ion-button expand="block" shape="round" class="btn-logout-pill" (click)="onLogout()">
              <ion-icon slot="start" name="log-out-outline" class="btn-logout-icon"></ion-icon>
              <ion-text>Log Out</ion-text>
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>

    <!-- Bottom Navigation Bar (Tab 4 Profile active & elevated) -->
    <ion-row class="bottom-nav-bar ion-align-items-center ion-justify-content-around">
      <!-- Tab 1: Home -->
      <ion-col class="nav-tab ion-text-center">
        <ion-button fill="clear" class="btn-nav-tab" (click)="goToHome()" aria-label="Home">
          <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.2">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1v-9.5z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </ion-button>
      </ion-col>

      <!-- Tab 2: Location Pin -->
      <ion-col class="nav-tab ion-text-center">
        <ion-button fill="clear" class="btn-nav-tab" (click)="goToMap()" aria-label="Location Map">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="9" r="2.5" fill="#ffffff" />
          </svg>
        </ion-button>
      </ion-col>

      <!-- Tab 3: Route -->
      <ion-col class="nav-tab ion-text-center">
        <ion-button fill="clear" class="btn-nav-tab" (click)="goToRoute()" aria-label="Route Estimation">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2">
            <circle cx="6" cy="18" r="2.5" fill="#ffffff" />
            <circle cx="18" cy="6" r="2.5" fill="#ffffff" />
            <path d="M6 15.5 C 6 11, 18 13, 18 8.5" stroke-linecap="round" stroke-dasharray="2 3" />
          </svg>
        </ion-button>
      </ion-col>

      <!-- Tab 4: Profile (Elevated in circular badge with notch!) -->
      <ion-col class="nav-tab active-tab ion-text-center">
        <ion-button fill="clear" class="btn-elevated-profile" aria-label="User Profile">
          <svg class="nav-icon" viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#ffffff" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="10" r="3" />
            <path d="M6.168 18.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.832 2.849" />
          </svg>
        </ion-button>
      </ion-col>
    </ion-row>

  </ion-grid>
</ion-content>
