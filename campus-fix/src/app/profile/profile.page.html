<ion-content [fullscreen]="true" class="profile-content">
  <div class="profile-container">

    <!-- Top User Header Banner -->
    <div class="profile-header-banner">
      <div class="avatar-badge-wrapper">
        <img
          src="assets/icon/quenie-avatar.png"
          alt="Queenie Dapooh"
          class="user-avatar-img"
        />
        <div class="edit-badge-btn" aria-label="Edit Profile">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="#183661">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
        </div>
      </div>

      <div class="user-meta-box">
        <h2 class="user-display-name">Queenie Dapooh</h2>
        <span class="user-handle-name">@queeniedapooh</span>
      </div>

      <!-- Header Logout Button -->
      <button type="button" class="btn-logout-header" (click)="onLogout()" aria-label="Log Out" title="Log Out">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Main Content Area -->
    <div class="profile-body-content">
      <!-- Section Title -->
      <h1 class="section-heading">Search History</h1>

      <!-- History Cards List -->
      <div class="history-cards-list">

        <!-- Card 1: Car -->
        <div class="history-card" (click)="selectHistory(0)">
          <div class="card-icon-circle">
            <img src="assets/icon/mode-car.png" alt="Car" class="history-mode-icon" />
          </div>

          <div class="card-info-col">
            <h3 class="mode-title">Car</h3>
            <span class="route-subtitle">Sumacab - SM Mega Center</span>
            <span class="distance-text">6.1 km</span>
          </div>

          <div class="card-fare-col">
            <span class="fare-amount">₱ 130.00</span>
            <div class="radio-select-circle" [class.checked]="selectedCard === 0"></div>
          </div>
        </div>

        <!-- Card 2: Tricycle -->
        <div class="history-card" (click)="selectHistory(1)">
          <div class="card-icon-circle">
            <img src="assets/icon/mode-tricycle.png" alt="Tricycle" class="history-mode-icon" />
          </div>

          <div class="card-info-col">
            <h3 class="mode-title">Tricycle</h3>
            <span class="route-subtitle">Sumacab - Santa Rosa</span>
            <span class="distance-text">3.4 km</span>
          </div>

          <div class="card-fare-col">
            <span class="fare-amount">₱ 80.00</span>
            <div class="radio-select-circle" [class.checked]="selectedCard === 1"></div>
          </div>
        </div>

        <!-- Card 3: Bicycle -->
        <div class="history-card" (click)="selectHistory(2)">
          <div class="card-icon-circle">
            <img src="assets/icon/mode-bicycle.png" alt="Bicycle" class="history-mode-icon" />
          </div>

          <div class="card-info-col">
            <h3 class="mode-title">Bicycle</h3>
            <span class="route-subtitle">Sumacab - Pacific NE</span>
            <span class="distance-text">2.3 km</span>
          </div>

          <div class="card-fare-col">
            <span class="fare-amount">₱ 80.00</span>
            <div class="radio-select-circle" [class.checked]="selectedCard === 2"></div>
          </div>
        </div>

      </div>

      <!-- Log Out Button -->
      <div class="logout-btn-container">
        <button type="button" class="btn-logout-pill" (click)="onLogout()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="logout-icon">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Log Out</span>
        </button>
      </div>
    </div>

    <!-- Bottom Navigation Bar (Tab 4 Profile active & elevated) -->
    <div class="bottom-nav-bar">
      <!-- Tab 1: Home -->
      <div class="nav-tab">
        <button type="button" class="btn-nav-tab" (click)="goToHome()" aria-label="Home">
          <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.2">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1v-9.5z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Tab 2: Location Pin -->
      <div class="nav-tab">
        <button type="button" class="btn-nav-tab" (click)="goToMap()" aria-label="Location Map">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="9" r="2.5" fill="#ffffff" />
          </svg>
        </button>
      </div>

      <!-- Tab 3: Route -->
      <div class="nav-tab">
        <button type="button" class="btn-nav-tab" (click)="goToRoute()" aria-label="Route Estimation">
          <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2">
            <circle cx="6" cy="18" r="2.5" fill="#ffffff" />
            <circle cx="18" cy="6" r="2.5" fill="#ffffff" />
            <path d="M6 15.5 C 6 11, 18 13, 18 8.5" stroke-linecap="round" stroke-dasharray="2 3" />
          </svg>
        </button>
      </div>

      <!-- Tab 4: Profile (Elevated in circular badge with notch!) -->
      <div class="nav-tab active-tab">
        <button type="button" class="btn-elevated-profile" aria-label="User Profile">
          <svg class="nav-icon" viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#ffffff" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="10" r="3" />
            <path d="M6.168 18.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.832 2.849" />
          </svg>
        </button>
      </div>
    </div>

  </div>
</ion-content>
