<ion-content [fullscreen]="true" class="search-results-content">
  <div class="search-results-container">

    <!-- Top Search Header Bar -->
    <div class="search-header-bar">
      <button type="button" class="btn-chevron-back" (click)="onBack()" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="search-input-wrapper">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
          class="header-search-input"
          placeholder="Search Location"
        />
      </div>

      <button type="button" class="btn-search-icon" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <!-- Header Divider Line -->
    <div class="header-divider"></div>

    <!-- Results List (Exact Matches from Screenshot) -->
    <div class="results-list">
      <div
        *ngFor="let item of filteredLocations"
        class="result-item"
        (click)="selectLocation(item)"
      >
        <div class="item-icon-box">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#94a3b8">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5" fill="#f8fafc"/>
          </svg>
        </div>

        <div class="item-title-box">
          <span class="location-name">{{ item.name }}</span>
        </div>

        <div class="item-distance-box">
          <span class="distance-num">{{ item.distance }}</span>
          <span class="distance-unit">Kilometers</span>
        </div>
      </div>
    </div>

  </div>
</ion-content>
