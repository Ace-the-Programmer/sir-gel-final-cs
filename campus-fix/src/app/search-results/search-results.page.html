<ion-header class="ion-no-border search-results-header">
  <ion-toolbar class="search-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="onBack()" class="btn-back" aria-label="Back">
        <ion-icon name="chevron-back" class="toolbar-icon"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-input
      type="text"
      [(ngModel)]="searchQuery"
      (ionInput)="onSearchChange()"
      placeholder="Search Location or Campus Hub"
      class="header-search-input"
    ></ion-input>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="onSearchChange()" class="btn-search" aria-label="Search">
        <ion-icon name="search" class="toolbar-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <div class="header-divider"></div>
</ion-header>

<ion-content [fullscreen]="true" class="search-results-content">
  <div *ngIf="isLoading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p style="color: #64748b; font-size: 13px; margin-top: 8px;">Loading locations from MySQL database...</p>
  </div>

  <ion-list *ngIf="!isLoading" lines="full" class="results-list">
    <ion-item
      *ngFor="let item of filteredLocations"
      button="true"
      detail="false"
      class="result-item"
      (click)="selectLocation(item)"
    >
      <ion-icon slot="start" name="location" class="location-pin-icon"></ion-icon>

      <ion-label class="location-label">
        <ion-text class="location-name">{{ item.name }}</ion-text>
      </ion-label>

      <ion-note slot="end" class="distance-note">
        <ion-text class="distance-num">{{ item.distance }}</ion-text>
        <ion-text class="distance-unit">Kilometers</ion-text>
      </ion-note>
    </ion-item>

    <ion-item *ngIf="filteredLocations.length === 0" lines="none">
      <ion-label class="ion-text-center" color="medium">
        No campus locations found matching "{{ searchQuery }}"
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
