<ion-content [fullscreen]="true" class="welcome-content">
  <ion-grid class="welcome-grid">
    <!-- Top Greeting Area -->
    <ion-row class="top-row ion-justify-content-center ion-text-center">
      <ion-col size="12" size-sm="10" size-md="8" size-lg="6" size-xl="5">
        <div class="welcome-heading-box">
          <h1 class="welcome-title-text">Welcome to</h1>
          <h1 class="welcome-brand-text">LocaRate</h1>
          <p class="welcome-subtitle-text">Smart Location, Perfect Estimation</p>
        </div>

        <!-- Search Bar with magnifying glass on the right -->
        <div class="search-pill-wrapper" (click)="goToMap()">
          <span class="search-pill-placeholder">Search location</span>
          <ion-icon name="search" class="search-pill-icon"></ion-icon>
        </div>
      </ion-col>
    </ion-row>

    <!-- Bottom Sheet / Centered Card: LocaRate Account Setup -->
    <ion-row class="bottom-card-row ion-justify-content-center">
      <ion-col size="12" size-sm="10" size-md="7" size-lg="5" size-xl="4">
        <div class="account-card">
          <div class="account-card-content">
            <!-- Header Row with Back Button & Title -->
            <div class="card-header-bar">
              <button type="button" class="btn-card-back" (click)="onBack()" aria-label="Go back">
                <ion-icon name="arrow-back-outline"></ion-icon>
              </button>
              <div class="card-heading-box">
                <span class="card-heading-text">Create your LocaRate</span>
                <span class="card-heading-text">account</span>
              </div>
            </div>

            <!-- Step 0: Social Signup Options (Matches Mockup) -->
            <div *ngIf="step === 0" class="step-container social-step">
              <button type="button" class="btn-social-pill" (click)="goToGoogleAuth()">
                <svg class="social-svg-icon" viewBox="0 0 24 24" width="22" height="22">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span class="social-text">Sign up with Google</span>
              </button>

              <button type="button" class="btn-social-pill" (click)="goToFacebookAuth()">
                <svg class="social-svg-icon" viewBox="0 0 24 24" width="22" height="22" fill="#ffffff">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                <span class="social-text">Sign up with Facebook</span>
              </button>
            </div>

            <!-- Step 1: Create Username -->
            <div *ngIf="step === 1" class="step-container">
              <ion-item lines="none" class="input-pill-item">
                <ion-input
                  type="text"
                  placeholder="Create your username"
                  [(ngModel)]="username"
                  class="pill-input"
                ></ion-input>
              </ion-item>

              <ion-button
                expand="block"
                shape="round"
                class="btn-navy-next"
                (click)="onNext()"
              >
                <ion-text class="btn-next-text">Next</ion-text>
              </ion-button>
            </div>

            <!-- Step 2: Create Password -->
            <div *ngIf="step === 2" class="step-container">
              <ion-item lines="none" class="input-pill-item">
                <ion-input
                  type="password"
                  placeholder="Create your password"
                  [(ngModel)]="password"
                  class="pill-input"
                ></ion-input>
              </ion-item>

              <ion-button
                expand="block"
                shape="round"
                class="btn-navy-next"
                (click)="onNext()"
              >
                <ion-text class="btn-next-text">Next</ion-text>
              </ion-button>
            </div>

            <!-- Step 3: Birthday -->
            <div *ngIf="step === 3" class="step-container">
              <ion-item lines="none" class="input-pill-item">
                <ion-input
                  type="text"
                  placeholder="Birthday"
                  [(ngModel)]="birthday"
                  class="pill-input"
                ></ion-input>
                <ion-icon slot="end" name="calendar-outline" class="calendar-icon"></ion-icon>
              </ion-item>

              <ion-button
                expand="block"
                shape="round"
                class="btn-navy-next"
                (click)="onNext()"
              >
                <ion-text class="btn-next-text">Next</ion-text>
              </ion-button>
            </div>

          </div>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
