<ion-content [fullscreen]="true" class="get-started-content">
  <ion-grid class="get-started-grid">
    <!-- Top Area: Logo & App Title -->
    <ion-row class="brand-row ion-justify-content-center ion-align-items-center">
      <ion-col size="12" class="ion-text-center">
        <ion-img
          src="assets/icon/locarate-logo.svg"
          alt="TaraCommute Logo"
          class="get-started-logo"
        ></ion-img>

        <div class="brand-title-wrap">
          <h1 class="brand-title">
            <span class="brand-tara">Tara</span><span class="brand-commute">Commute</span>
          </h1>
        </div>
      </ion-col>
    </ion-row>

    <!-- Bottom Area: Buttons & Agreement -->
    <ion-row class="actions-row ion-justify-content-center">
      <ion-col size="12" class="ion-text-center">
        <!-- 1. Primary Action: Get Started -->
        <ion-button
          expand="block"
          shape="round"
          class="btn-primary-pill"
          (click)="onGetStarted()"
        >
          <ion-text>Get Started</ion-text>
        </ion-button>

        <!-- 2. Secondary Action: Login -->
        <ion-button
          expand="block"
          shape="round"
          class="btn-outline-pill"
          (click)="onLogin()"
        >
          <ion-text>Login</ion-text>
        </ion-button>

        <!-- 3. Tertiary Action: Continue as Guest -->
        <ion-button
          expand="block"
          shape="round"
          class="btn-ghost-pill"
          (click)="onContinueGuest()"
        >
          <ion-text>Continue as Guest</ion-text>
        </ion-button>

        <!-- Terms and Privacy Links -->
        <ion-text class="terms-text">
          <span class="terms-muted">By continuing you agree to TaraCommute's</span>
          <br />
          <span class="terms-links">
            <a href="#" class="terms-link">Terms of Service</a>
            <span class="terms-muted"> and </span>
            <a href="#" class="terms-link">Privacy Policy</a>
          </span>
        </ion-text>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
