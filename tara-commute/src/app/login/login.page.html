<ion-header class="ion-no-border login-header">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" size="small" class="btn-back" (click)="onBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
  <ion-grid class="login-grid">
    <!-- Top Area: Logo, Title, Input Form, & Login Action -->
    <ion-row class="brand-form-row ion-justify-content-center">
      <ion-col size="12" class="ion-text-center">

        <!-- TaraCommute Logo -->
        <div class="logo-wrapper">
          <ion-img src="assets/icon/locarate-logo-dark.svg" alt="TaraCommute" class="login-logo-img"></ion-img>
        </div>

        <!-- Welcome Heading -->
        <ion-text color="dark">
          <h1 class="welcome-heading">Welcome back, Commuter!</h1>
        </ion-text>
        <ion-text color="medium">
          <p class="login-subtext">Sign in with your commuter username</p>
        </ion-text>

        <!-- Input Fields -->
        <form class="login-form" (ngSubmit)="onLogin()">
          <ion-item lines="none" class="custom-input-item">
            <ion-input type="text" placeholder="Username" [(ngModel)]="username" name="username"
              class="custom-ionic-input" required></ion-input>
          </ion-item>

          <ion-item lines="none" class="custom-input-item password-item">
            <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="Password" [(ngModel)]="password" name="password"
              class="custom-ionic-input" required></ion-input>
            <ion-button fill="clear" slot="end" class="password-toggle-btn" (click)="togglePasswordVisibility()" type="button" aria-label="Toggle password visibility">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-item>

          <!-- Login Button -->
          <ion-button expand="block" shape="round" class="btn-primary-pill" (click)="onLogin()" [disabled]="isLoading">
            <ion-spinner *ngIf="isLoading" name="dots"></ion-spinner>
            <ion-text *ngIf="!isLoading">Login</ion-text>
          </ion-button>
        </form>

      </ion-col>
    </ion-row>

    <!-- Bottom Area: Sign Up Link (No Gmail / Facebook) -->
    <ion-row class="bottom-actions-row ion-justify-content-center">
      <ion-col size="12" class="ion-text-center">
        <ion-text color="medium" class="signup-prompt">
          Don't have a commuter account?
        </ion-text>
        <ion-button fill="clear" size="small" class="signup-link-btn" (click)="goToRegister()">
          <ion-text color="primary"><strong>Sign Up</strong></ion-text>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
