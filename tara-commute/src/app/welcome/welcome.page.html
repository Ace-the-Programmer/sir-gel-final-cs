<ion-header class="ion-no-border signup-header">
  <ion-toolbar class="signup-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" size="small" class="btn-header-back" (click)="onBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="signup-header-title">Create Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="welcome-content">
  <ion-grid class="signup-grid ion-no-padding">
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-sm="10" size-md="8" size-lg="6" class="signup-col">

        <!-- Main Registration Ionic Card Component -->
        <ion-card class="signup-card">
          <!-- Card Header: App Logo & Brand Title -->
          <ion-card-header class="signup-card-header ion-text-center">
            <div class="logo-circle-wrapper">
              <ion-img src="assets/icon/locarate-logo-dark.svg" alt="TaraCommute Logo" class="signup-logo-img"></ion-img>
            </div>
            <ion-card-title class="signup-brand-title">
              <span class="brand-tara">Tara</span><span class="brand-commute">Commute</span>
            </ion-card-title>
            <ion-card-subtitle class="signup-brand-subtitle">
              Register your student commuter pass
            </ion-card-subtitle>
          </ion-card-header>

          <!-- Card Content: Form & Actions -->
          <ion-card-content class="signup-card-content">
            <form (ngSubmit)="onRegister()" class="signup-ionic-form">

              <!-- Ionic Form Items List -->
              <ion-list lines="none" class="signup-item-list">

                <!-- 1. Student ID Number -->
                <ion-item class="custom-ionic-item">
                  <ion-icon slot="start" name="id-card-outline" class="item-leading-icon" color="primary"></ion-icon>
                  <ion-input
                    type="text"
                    label="Student ID Number"
                    labelPlacement="floating"
                    placeholder="e.g. 2026-0001"
                    [(ngModel)]="studentNo"
                    name="studentNo"
                    class="ionic-form-input"
                    required
                  ></ion-input>
                </ion-item>

                <!-- 2. Full Name -->
                <ion-item class="custom-ionic-item">
                  <ion-icon slot="start" name="person-outline" class="item-leading-icon" color="primary"></ion-icon>
                  <ion-input
                    type="text"
                    label="Full Name"
                    labelPlacement="floating"
                    placeholder="e.g. Juan Dela Cruz"
                    [(ngModel)]="fullName"
                    name="fullName"
                    class="ionic-form-input"
                    required
                  ></ion-input>
                </ion-item>

                <!-- 3. Degree Course -->
                <ion-item class="custom-ionic-item">
                  <ion-icon slot="start" name="school-outline" class="item-leading-icon" color="primary"></ion-icon>
                  <ion-select
                    label="Degree Course"
                    labelPlacement="floating"
                    [(ngModel)]="course"
                    name="course"
                    interface="action-sheet"
                    class="ionic-form-select"
                  >
                    <ion-select-option value="BSIT">BS Information Technology (BSIT)</ion-select-option>
                    <ion-select-option value="BSCS">BS Computer Science (BSCS)</ion-select-option>
                    <ion-select-option value="BSIS">BS Information Systems (BSIS)</ion-select-option>
                    <ion-select-option value="BSEMC">BS Entertainment & Multimedia</ion-select-option>
                    <ion-select-option value="BSCPE">BS Computer Engineering</ion-select-option>
                  </ion-select>
                </ion-item>

                <!-- 4. Year Level -->
                <ion-item class="custom-ionic-item">
                  <ion-icon slot="start" name="calendar-outline" class="item-leading-icon" color="primary"></ion-icon>
                  <ion-select
                    label="Year Level"
                    labelPlacement="floating"
                    [(ngModel)]="yearLevel"
                    name="yearLevel"
                    interface="action-sheet"
                    class="ionic-form-select"
                  >
                    <ion-select-option [value]="1">1st Year</ion-select-option>
                    <ion-select-option [value]="2">2nd Year</ion-select-option>
                    <ion-select-option [value]="3">3rd Year</ion-select-option>
                    <ion-select-option [value]="4">4th Year</ion-select-option>
                  </ion-select>
                </ion-item>

                <!-- 5. Password -->
                <ion-item class="custom-ionic-item">
                  <ion-icon slot="start" name="lock-closed-outline" class="item-leading-icon" color="primary"></ion-icon>
                  <ion-input
                    type="password"
                    label="Password"
                    labelPlacement="floating"
                    placeholder="Create a password"
                    [(ngModel)]="password"
                    name="password"
                    class="ionic-form-input"
                    required
                  ></ion-input>
                </ion-item>

              </ion-list>

              <!-- Submit Action Button Component -->
              <ion-button
                expand="block"
                shape="round"
                type="submit"
                class="btn-submit-signup"
                [disabled]="isSubmitting"
              >
                <ion-spinner *ngIf="isSubmitting" name="dots"></ion-spinner>
                <ion-text *ngIf="!isSubmitting">Create Account</ion-text>
              </ion-button>

            </form>

            <!-- Bottom Prompt: Go to Login Component -->
            <ion-row class="ion-justify-content-center ion-align-items-center signup-footer-row">
              <ion-col size="12" class="ion-text-center">
                <ion-text color="medium" class="footer-prompt-text">
                  Already have a commuter account?
                </ion-text>
                <ion-button fill="clear" size="small" class="btn-login-link" (click)="goToLogin()">
                  <ion-text color="primary"><strong>Log In</strong></ion-text>
                </ion-button>
              </ion-col>
            </ion-row>

          </ion-card-content>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
