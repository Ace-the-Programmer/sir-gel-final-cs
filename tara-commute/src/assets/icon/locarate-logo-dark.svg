<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lightBlueWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Orbital Transit Loop (Compass Arc) -->
  <g transform="translate(180, 180) rotate(-28)">
    <ellipse cx="0" cy="0" rx="142" ry="52" fill="none" stroke="#2563eb" stroke-width="7" stroke-dasharray="14 10" opacity="0.85"/>
    <line x1="0" y1="-56" x2="0" y2="-44" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-136" cy="4" r="8" fill="#2563eb"/>
    <circle cx="-136" cy="4" r="3.5" fill="#ffffff"/>
    <circle cx="136" cy="-4" r="9" fill="#1d4ed8"/>
    <circle cx="136" cy="-4" r="4" fill="#ffffff"/>
  </g>

  <!-- Campus Compass & Speed Arrow (Origami Pin) -->
  <g transform="translate(180, 172)" filter="url(#subtleShadow)">
    <path d="M -90,48 L -45,26 M -75,68 L -35,42 M -85,18 L -42,10"
          stroke="#2563eb" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <polygon points="0,-92 -68,36 -8,18" fill="url(#lightBlueWing)" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="0,-92 68,36 8,18" fill="url(#darkBlueGrad)" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="0,-92 -8,18 0,38 8,18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

    <circle cx="0" cy="-14" r="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="5"/>
    <circle cx="0" cy="-14" r="8" fill="#2563eb"/>
  </g>
</svg>
