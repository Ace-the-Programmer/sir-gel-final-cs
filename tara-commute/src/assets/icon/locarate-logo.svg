<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <defs>
    <!-- Royal Blue & White Gradients -->
    <linearGradient id="blueWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="blueCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="blueOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Orbital Transit Loop (Compass Arc) -->
  <g transform="translate(180, 180) rotate(-28)">
    <ellipse cx="0" cy="0" rx="142" ry="52" fill="none" stroke="url(#blueOrbitGrad)" stroke-width="8" stroke-dasharray="14 10"/>
    <line x1="0" y1="-56" x2="0" y2="-44" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-136" cy="4" r="8" fill="#2563eb"/>
    <circle cx="-136" cy="4" r="3.5" fill="#ffffff"/>
    <circle cx="136" cy="-4" r="9" fill="#1d4ed8"/>
    <circle cx="136" cy="-4" r="4" fill="#ffffff"/>
  </g>

  <!-- Campus Compass & Speed Arrow (Origami Pin) -->
  <g transform="translate(180, 172)" filter="url(#cleanShadow)">
    <!-- Motion Speed Lines -->
    <path d="M -90,48 L -45,26 M -75,68 L -35,42 M -85,18 L -42,10"
          stroke="#3b82f6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <!-- Left Wing (Crisp White to Soft Sky Tint) -->
    <polygon points="0,-92 -68,36 -8,18" fill="url(#blueWingGrad)" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Right Wing (Solid Royal Blue Core) -->
    <polygon points="0,-92 68,36 8,18" fill="url(#blueCoreGrad)" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Center Spine Keel (Solid Pure White) -->
    <polygon points="0,-92 -8,18 0,38 8,18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

    <!-- Center Compass Beacon / Pin Core -->
    <circle cx="0" cy="-14" r="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="5"/>
    <circle cx="0" cy="-14" r="8" fill="#2563eb"/>
  </g>
</svg>
