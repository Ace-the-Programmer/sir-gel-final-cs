<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mapFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3964" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#142c4f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#10233f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="roadStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d5284"/>
      <stop offset="100%" stop-color="#1b3964"/>
    </linearGradient>
  </defs>

  <!-- Perspective Grid / Map Blocks -->
  <g stroke="#1b3861" stroke-width="1.5" opacity="0.65">
    <!-- Horizontal Street Lines with perspective -->
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="215" x2="400" y2="215" />
    <line x1="0" y1="255" x2="400" y2="255" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="0" y1="410" x2="400" y2="410" />
    <line x1="0" y1="480" x2="400" y2="480" />

    <!-- Vertical / Angled Grid Lines -->
    <line x1="40" y1="180" x2="10" y2="500" />
    <line x1="90" y1="180" x2="60" y2="500" />
    <line x1="140" y1="180" x2="120" y2="500" />
    <line x1="200" y1="180" x2="200" y2="500" />
    <line x1="260" y1="180" x2="280" y2="500" />
    <line x1="310" y1="180" x2="340" y2="500" />
    <line x1="360" y1="180" x2="390" y2="500" />

    <!-- Cross Street Blocks -->
    <rect x="25" y="225" width="45" height="20" rx="3" fill="#142c4f" opacity="0.5" />
    <rect x="80" y="225" width="50" height="20" rx="3" fill="#142c4f" opacity="0.5" />
    <rect x="140" y="225" width="50" height="20" rx="3" fill="#142c4f" opacity="0.5" />
    <rect x="210" y="225" width="40" height="20" rx="3" fill="#142c4f" opacity="0.5" />
    <rect x="270" y="225" width="35" height="20" rx="3" fill="#142c4f" opacity="0.5" />

    <rect x="15" y="315" width="40" height="25" rx="3" fill="#142c4f" opacity="0.6" />
    <rect x="70" y="315" width="60" height="25" rx="3" fill="#142c4f" opacity="0.6" />
    <rect x="145" y="315" width="45" height="25" rx="3" fill="#142c4f" opacity="0.6" />
    <rect x="205" y="315" width="65" height="25" rx="3" fill="#142c4f" opacity="0.6" />
    <rect x="285" y="315" width="45" height="25" rx="3" fill="#142c4f" opacity="0.6" />

    <rect x="5" y="425" width="65" height="40" rx="4" fill="#142c4f" opacity="0.7" />
    <rect x="85" y="425" width="75" height="40" rx="4" fill="#142c4f" opacity="0.7" />
    <rect x="180" y="425" width="90" height="40" rx="4" fill="#142c4f" opacity="0.7" />
    <rect x="290" y="425" width="75" height="40" rx="4" fill="#142c4f" opacity="0.7" />
  </g>

  <!-- Curving Route Arc (Bright Cyan / Light Blue) -->
  <path
    d="M -20,440
       C 80,300 240,240 380,260"
    fill="none"
    stroke="#2aaae2"
    stroke-width="5"
    opacity="0.8"
  />

  <!-- Map Pin 1: Bottom Left (Large foreground) -->
  <g transform="translate(60, 420)">
    <path
      d="M 0,-50
         C 28,-50 50,-28 50,0
         C 50,32 0,70 0,70
         C 0,70 -50,32 -50,0
         C -50,-28 -28,-50 0,-50 Z"
      fill="#d8e2ec"
      stroke="#142b4d"
      stroke-width="3"
    />
    <circle cx="0" cy="0" r="18" fill="#1b3a64" />
  </g>

  <!-- Map Pin 2: Mid-left -->
  <g transform="translate(140, 290) scale(0.65)">
    <path
      d="M 0,-50
         C 28,-50 50,-28 50,0
         C 50,32 0,70 0,70
         C 0,70 -50,32 -50,0
         C -50,-28 -28,-50 0,-50 Z"
      fill="#d8e2ec"
      stroke="#142b4d"
      stroke-width="3"
    />
    <circle cx="0" cy="0" r="18" fill="#1b3a64" />
  </g>

  <!-- Map Pin 3: Upper Right -->
  <g transform="translate(330, 260) scale(0.45)">
    <path
      d="M 0,-50
         C 28,-50 50,-28 50,0
         C 50,32 0,70 0,70
         C 0,70 -50,32 -50,0
         C -50,-28 -28,-50 0,-50 Z"
      fill="#d8e2ec"
      stroke="#142b4d"
      stroke-width="3"
    />
    <circle cx="0" cy="0" r="18" fill="#1b3a64" />
  </g>

  <!-- Gradient Overlay -->
  <rect x="0" y="0" width="400" height="500" fill="url(#mapFade)" />
</svg>
